<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painting Title — Leanne M Christie</title>
<meta name="description" content="An oil painting by Leanne M Christie.">
<style>
  :root { box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  html { background: #fff; }
  body {
    margin: 0;
    padding: 0 0 4rem;
    background: #fff;
    color: #1c1c3c;
    font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 1.05rem;
    line-height: 1.9;
  }
  header { padding: 2rem 1.5rem 1.5rem; }
  .logo { display: block; width: min(100%, 340px); height: auto; margin: 0 0 0 -0.6rem; }

  /* The painting: shown whole, never cropped, tinted or overlaid */
  .hero { margin: 0; padding: 0 1.5rem; text-align: center; }
  .zoom {
    display: inline-block;
    padding: 0;
    border: 0;
    background: none;
    cursor: zoom-in;
    max-width: 100%;
  }
  .zoom:focus-visible { outline: 3px solid #1f6b3a; outline-offset: 4px; }
  .zoom img {
    display: block;
    max-width: 100%;
    width: auto;
    height: auto;
    max-height: 80vh;
    max-height: 80svh;
    margin: 0 auto;
  }
  .hint { margin: 0.75rem 0 0; font-size: 0.85rem; color: #666; line-height: 1.4; }

  main { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1.5rem 0; }
  h1 {
    font-size: clamp(2rem, 7vw, 3rem);
    font-weight: 400;
    color: #666;
    text-align: center;
    letter-spacing: 0.01em;
    line-height: 1.1;
    margin: 0 0 0.5rem;
  }
  .details { text-align: center; color: #666; margin: 0 0 3rem; }
  p { margin: 0 0 1.25rem; }
  .contact { margin: 2rem 0; padding-left: 1.1rem; border-left: 2px solid #860607; }
  .contact p { margin: 0; }
  a { color: #1f6b3a; text-underline-offset: 0.2em; }
  a:hover { color: #860607; }
  a:focus-visible { outline: 3px solid #1f6b3a; outline-offset: 3px; border-radius: 2px; }

  /* Lightbox */
  dialog {
    width: 100vw; height: 100vh; height: 100dvh;
    max-width: none; max-height: none;
    margin: 0; padding: 0; border: 0;
    background: rgba(0, 0, 0, 0.94);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.94); }
  dialog img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    padding: 1rem;
    cursor: zoom-out;
  }
  .close {
    position: absolute; top: 0.75rem; right: 0.75rem; z-index: 1;
    width: 2.75rem; height: 2.75rem;
    border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    color: #fff; font-size: 1.6rem; line-height: 1; cursor: pointer;
  }
  .close:hover { background: rgba(255, 255, 255, 0.3); }
  .close:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <a href="/"><img class="logo" src="logo.png" width="800" height="233" alt="leanne m christie — be a collector"></a>
</header>

<figure class="hero">
  <button class="zoom" type="button" aria-label="View painting full screen">
    <img id="painting" src="client-painting.jpg" alt="Painting Title, an oil painting by Leanne M Christie">
  </button>
  <figcaption class="hint">Click the painting to view it full screen</figcaption>
</figure>

<main>
  <h1>Painting Title</h1>
  <p class="details">Oil on canvas &middot; 00 &times; 00 in &middot; 2026</p>

  <p>A short note to your client can go here, or delete this paragraph.</p>

  <div class="contact">
    <p>Call or text: <a href="tel:+17787081531">778 708 1531</a></p>
    <p>Instagram: <a href="https://www.instagram.com/leannemchristie/" rel="noopener">@leannemchristie</a></p>
    <p>Facebook: <a href="https://www.facebook.com/leannemchristie" rel="noopener">@leannemchristie</a></p>
  </div>
</main>

<dialog id="lightbox" aria-label="Painting full screen view">
  <button class="close" type="button" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="">
</dialog>

<script>
  (function () {
    var dlg = document.getElementById('lightbox');
    var big = document.getElementById('lightbox-img');
    var src = document.getElementById('painting');
    var opener = document.querySelector('.zoom');

    opener.addEventListener('click', function () {
      big.src = src.currentSrc || src.src;
      big.alt = src.alt;
      dlg.showModal();
    });
    // Click anywhere (image, backdrop, or X) closes; Esc is handled natively
    dlg.addEventListener('click', function () { dlg.close(); });
  })();
</script>
</body>
</html>
